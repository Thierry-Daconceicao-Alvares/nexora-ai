# Migrations for running by hand: `alembic upgrade head`, or
# `alembic revision --autogenerate -m "..."` after a change to db/models.py.
# The database comes from NEXORA_DATABASE_URL (see .env.example). The API
# applies the migrations itself at start-up.
[alembic]
script_location = src/nexora/db/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
