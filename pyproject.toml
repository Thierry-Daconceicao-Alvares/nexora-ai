[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-ai"
version = "0.2.0"
description = "AI-assisted purchase request review: deterministic checks, cited explanations, human decisions, full audit trail."
readme = "README.md"
license = "MIT"
authors = [{ name = "Thierry Daconceição Alvares" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.151.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "pyyaml==6.0.3",
    "google-genai==2.31.0",
    "httpx==0.28.1",
    "alembic==1.20.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# The Streamlit interface (app/).
ui = [
    "streamlit==1.66.0",
    "altair==6.3.0",
]
# Browser tests of the interface (tests/ui); then: playwright install chromium
e2e = [
    "playwright==1.64.0",
]
dev = [
    "pytest==9.1.1",
    "httpx2==2.15.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexora = [
    "py.typed",
    "db/migrations/script.py.mako",
    "db/migrations/*.py",
    "db/migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["src/nexora/db/migrations/script.py.mako"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The interface modules in app/ import each other by name (Streamlit runs app/).
known-first-party = ["nexora", "tests", "client", "state", "ui", "views"]
