# Runs the AI analysis against a real model on six scenario requests.
# Started manually (Actions > Live check > Run workflow); needs the
# MISTRAL_API_KEY (or GEMINI_API_KEY) repository secret. A run uses about
# 20,000 tokens.
name: Live check

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        type: choice
        options: [mistral, gemini]
        default: mistral

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Six scenarios through the pipeline
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -o pipefail
          key_name="$(echo "$PROVIDER" | tr a-z A-Z)_API_KEY"
          test -n "${!key_name}" || { echo "::error::Add the $key_name repository secret first."; exit 1; }
          python scripts/live_check.py --provider "$PROVIDER" --out live-check.json 2>&1 | tee live-check.txt
      - if: always()
        run: |
          { echo '```'; cat live-check.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-check
          path: live-check.json
