# Runs the AI analysis against the real Gemini API on six scenario requests.
# Started manually (Actions > Live check with Gemini > Run workflow); needs the
# GEMINI_API_KEY repository secret. Uses a few thousand tokens per run.
name: Live check with Gemini

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Six scenarios through the pipeline with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Add the GEMINI_API_KEY repository secret first."; exit 1; }
          python scripts/live_check.py --out live-check.json | tee live-check.txt
      - if: always()
        run: |
          { echo '```'; cat live-check.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-check
          path: live-check.json
