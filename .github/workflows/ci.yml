name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL
        env:
          NEXORA_TEST_DATABASE_URL: postgresql+psycopg://nexora:ci-only@localhost:5432/nexora_test
        run: pytest tests/integration tests/security

  interface:
    name: Interface in a browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ui,e2e,dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -m ui tests/ui

  docker:
    name: Docker Compose stack starts and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build -d --wait
      - name: Submit a request and decide on it through the running stack
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/requests \
            -H "Authorization: Bearer demo-sophie" -H "Content-Type: application/json" \
            -d '{"external_ref":"PR-2026-00001","department":"Maintenance","supplier_id":"SUP-0002","item_category":"spare_parts","item_code":"MRO-BRG-6205","description":"Ball bearings 6205-2RS for conveyor line 3","quantity":"20","unit_price":"8.40","currency":"EUR","justification":"Preventive maintenance of conveyor line 3","delivery_date":"2099-01-15","attachments":[{"kind":"quote","file_name":"quote.pdf"}]}' \
            > submitted.json
          python3 -c "import json; d=json.load(open('submitted.json')); a=d['analysis']; assert d['status']=='awaiting_review', d; assert a['status']=='completed' and a['verification']=='verified', a; print(d['status'], d['route'], a['provider'], a['output']['recommendation']['action'])"
          id=$(python3 -c "import json; print(json.load(open('submitted.json'))['id'])")
          curl -fsS -X POST "http://localhost:8000/requests/$id/decisions" \
            -H "Authorization: Bearer demo-karim" -H "Content-Type: application/json" \
            -d '{"action":"approve","reason":"Within budget, quote attached, active supplier.","version":1}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='approved', d; print(d['status'])"
          # The migrations ran: a second start keeps the data and the schema.
          docker compose restart api && sleep 5
          docker compose up -d --wait
          curl -fsS "http://localhost:8000/requests/$id" -H "Authorization: Bearer demo-karim" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='approved' and len(d['decisions'])==1, d; print('persisted')"
      - name: The interface answers
        run: curl -fsS http://localhost:8501/_stcore/health
      - name: n8n workflows end to end (email intake, notifications, digest)
        run: |
          pip install httpx==0.28.1
          python3 scripts/e2e_n8n.py --api http://localhost:8000 --mailpit http://localhost:8025 \
            --smtp localhost:1025 \
            --digest-command "docker compose exec -T -e N8N_RUNNERS_BROKER_PORT=5690 n8n n8n execute --id 9b7dfceefef156"
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
